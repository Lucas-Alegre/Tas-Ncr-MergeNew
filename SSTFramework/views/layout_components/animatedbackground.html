<style>

    body, html {
        background-color: black;
    }

    #AnimatedBackground {
        position: absolute;
        z-index: -1;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
    }

        #AnimatedBackground img.bgfade {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

</style>

<div id="AnimatedBackground">
    <img class="bgfade" src="/images/background/Background_01.png">
    <img class="bgfade" src="/images/background/Background_02.png">
    <img class="bgfade" src="/images/background/Background_03.png">
    <img class="bgfade" src="/images/background/Background_04.png">
    <img class="bgfade" src="/images/background/Background_05.png">
    <script>
        $(window).load(function () {
            $('#AnimatedBackground img.bgfade').hide();
            function anim() {
                $("#AnimatedBackground img.bgfade").first().appendTo('#AnimatedBackground').fadeOut(2000);
                $("#AnimatedBackground img.bgfade").first().fadeIn(5000);
                setTimeout(anim, 6000);
            }
            anim();
        })
    </script>
</div>
