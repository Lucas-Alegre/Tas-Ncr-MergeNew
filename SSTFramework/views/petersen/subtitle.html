<!--
    Data:
        subtitle.text: text to display

    FireEvents:
        -

    ListenEvents:
        -
-->

<div class="subtitle" id="subtitle">
    <%- subtitle.text %>
</div>

<script>
    $(function () {

        SSFramework.centerInDiv("#subtitle");

        var tit = $(".subtitle");
        tit.tween(TweenHelpers.tweenSide(tit, "top", false, 300, 0));
    });
</script>
