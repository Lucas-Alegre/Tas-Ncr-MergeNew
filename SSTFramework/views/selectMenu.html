<script>
   $(function () {
    var component_data = <%- JSON.stringify(selectMenu) %>;
    
    $.each(component_data, function(key, value) {
        var element = $("#" + key + "Menu");

        element.click(function(evt) { 
            SSFramework.playAudio('boton.wav'); // Reproduce sonido al hacer clic
            
            if(component_data[key].hasOwnProperty('value')) {
                States.storeValue(component_data[key].value); // Guarda la selección
            }
            
            States.handleEvent(element); // Ejecuta el evento
        });

        // Asigna el texto y otros valores dinámicamente
        $.each(component_data[key], function(subkey, value) {
            element.data(subkey, value);
            if (subkey == "text") {
                const lines = value.split("-");
                const firstLine = lines.slice(0, -1).join("-");
                const secondLine = lines.slice(-1).join("-");

                element.find(".text-line").eq(0).html(firstLine);
                element.find(".text-line").eq(1).html(secondLine);
            } // Ahora cambia el texto dentro del span en la card
        });
    });

    
    var colorBanco = SSUtil.getBankColor();
    $(".select-icon-path-color").attr("fill", colorBanco);
});
</script>
