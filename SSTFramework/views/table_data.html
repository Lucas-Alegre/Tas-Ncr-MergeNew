<div class="table_container">
    <div class="table_wrapper">
        <%- table_data.text %>
    </div>
</div>

<script>
    $(function () {
        var component_data = <%- JSON.stringify(table_data) %>;

        var obj = $(".table_wrapper");
        $.each(component_data, function (key, value) {
            obj.data(key, value);
        });
    });
</script>
